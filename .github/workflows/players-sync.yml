name: players sync

# =============================================================================
#  JPL Fantasy Manager - spelerssynchronisatie  v1.1
# =============================================================================
#  v1.1  Twee correcties op v1.0:
#        (1) "python | tee" gaf de exitcode van tee door, niet die van python.
#            Een crash meldde daardoor succes. Nu met set -o pipefail.
#        (2) Opzet voor EEN repo: script, fm_basis.json en players.json staan
#            allemaal in JPLMC.Badges. Geen tweede checkout, geen aparte PAT.
#
#  Deze workflow hoort in .github/workflows/ van JPLMC.Badges.
#  In diezelfde repo moeten staan:
#     bouw_players.py
#     fm_basis.json        <- output van bouw_basis.py, MOET aanwezig zijn
#
#  Secrets in JPLMC.Badges -> Settings -> Secrets and variables -> Actions:
#     BSD_KEY           BSD API-token
#     MANAGER_API_KEY   voor het legen van de Worker-cache (optioneel)
#
#  PLAYERS_REPO_TOKEN is NIET meer nodig: pushen gebeurt met de ingebouwde
#  GITHUB_TOKEN, die via permissions: contents: write schrijfrecht krijgt.
#
#  Regelset 10.5: 05:00 en 17:00 Belgische tijd. GitHub draait op UTC, dus in
#  de zomertijd 03:00 en 15:00. Eind oktober moet dit 04:00 en 16:00 worden om
#  dezelfde lokale tijden te houden - GitHub past dat niet vanzelf aan.
# =============================================================================

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Repo uitchecken
        uses: actions/checkout@v4

      - name: Python klaarzetten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Eerst kijken of alles er staat. Ontbreekt er iets, dan stopt de run
      # hier met een duidelijke melding in plaats van verderop met een
      # onbegrijpelijke fout.
      - name: Bestanden controleren
        run: |
          echo "--- inhoud van de repo ---"
          ls -la
          echo "--------------------------"
          ontbreekt=0
          for f in bouw_players.py fm_basis.json; do
            if [ -f "$f" ]; then
              echo "OK       $f  ($(wc -c < "$f") bytes)"
            else
              echo "ONTBREEKT $f"
              ontbreekt=1
            fi
          done
          if [ "$ontbreekt" = "1" ]; then
            echo ""
            echo "Een vereist bestand ontbreekt in de repo. Zie de lijst hierboven."
            exit 1
          fi
          if [ -z "${BSD_KEY_CHECK}" ]; then
            echo "LET OP: secret BSD_KEY lijkt leeg. Controleer Settings > Secrets."
          fi
        env:
          BSD_KEY_CHECK: ${{ secrets.BSD_KEY }}

      - name: players.json bouwen
        id: bouw
        shell: bash
        env:
          BSD_KEY: ${{ secrets.BSD_KEY }}
        run: |
          # pipefail is essentieel: zonder dit maskeert tee een crash van python
          set -o pipefail
          python3 bouw_players.py --basis fm_basis.json --uit players.json | tee uitvoer.log
          if grep -q '^WIJZIGING=ja' uitvoer.log; then
            echo "gewijzigd=ja" >> "$GITHUB_OUTPUT"
          else
            echo "gewijzigd=nee" >> "$GITHUB_OUTPUT"
          fi

      - name: Committen en pushen
        if: steps.bouw.outputs.gewijzigd == 'ja'
        run: |
          git config user.name  "matchcenter-bot"
          git config user.email "matchcenter.bot@users.noreply.github.com"
          git add players.json
          if git diff --cached --quiet; then
            echo "Geen verschil ten opzichte van de vorige versie."
            exit 0
          fi
          git commit -m "players.json bijgewerkt [auto]"
          git push

      - name: Worker-cache legen
        if: steps.bouw.outputs.gewijzigd == 'ja'
        continue-on-error: true
        env:
          MANAGER_API_KEY: ${{ secrets.MANAGER_API_KEY }}
        run: |
          # Zonder dit serveert de Worker tot een uur lang de oude lijst.
          # Faalt dit, dan is dat niet kritiek: de cache verloopt vanzelf.
          curl -sS -X POST \
            -H "X-API-Key: ${MANAGER_API_KEY}" \
            https://manager.matchcenter-bot.workers.dev/admin/cache/clear \
            || echo "Cache legen mislukt - niet kritiek."
