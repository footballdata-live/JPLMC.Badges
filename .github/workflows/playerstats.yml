# =============================================================================
#  playerstats.yml v2 - bouwt playerstats.json voor de clubfanpages
# =============================================================================
#  Draait IN de repo footballdata-live/JPLMC.Badges zelf. Daardoor is er geen
#  PAT nodig: de ingebouwde GITHUB_TOKEN volstaat om terug te committen.
#  Dat scheelt een vervaldatum, en de vorige tokens verliepen op 1 september.
#
#  v2 ten opzichte van v1:
#    - DATA_REPO_TOKEN en de vlag --push zijn weg. De commit gebeurt hier,
#      met GITHUB_TOKEN.
#    - De twee curl-stappen zijn weg. playerstats.json en matches.json staan
#      in deze repo en komen mee met de checkout. Ze via GitHub Pages halen
#      was fragiel: Pages loopt achter op de repo omdat de site eerst moet
#      bouwen, dus twee runs kort na elkaar lazen een verouderde versie.
#
#  BENODIGDE SECRET
#    BSD_KEY - dezelfde als bij bouw_players
#
#  EENMALIG CONTROLEREN
#    Settings, Actions, General, Workflow permissions moet op
#    "Read and write permissions" staan. Zonder dat is de run groen terwijl
#    er niets gecommit wordt. Die instelling is bij deze repo al eens stil
#    teruggevallen op read-only.
#
#  LET OP DE BESTANDSNAAM
#    GitHub is hoofdlettergevoelig. Het bestand moet exact playerstats.json
#    heten, met een kleine p. De fanpage vraagt die URL kleingeschreven op,
#    en Playerstats.json zou daar een 404 geven.
# =============================================================================

name: playerstats

on:
  # Handmatig en via cron-job.org. Zonder schedule-blok is cron-job.org de
  # enige automatische trigger.
  workflow_dispatch:

# Nodig om te kunnen terugcommitten met GITHUB_TOKEN.
permissions:
  contents: write

# Twee runs tegelijk zouden allebei van dezelfde uitgangsstand vertrekken en
# elkaars commit overschrijven. De tweede wacht nu tot de eerste klaar is.
concurrency:
  group: playerstats
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest

    steps:
      - name: Repo uitchecken
        uses: actions/checkout@v4

      - name: Python opzetten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: playerstats.json bouwen
        env:
          BSD_KEY: ${{ secrets.BSD_KEY }}
        run: |
          python3 bouw_playerstats_v1.0.py \
            --uit playerstats.json \
            --matches matches.json

      - name: Committen als er iets veranderd is
        run: |
          # git diff beslist, niet de uitvoer van het script. Zo wordt er
          # nooit een lege commit gemaakt, ook niet als het script wel
          # schreef maar de inhoud identiek bleef.
          if git diff --quiet -- playerstats.json; then
            echo "playerstats.json ongewijzigd, niets te committen"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playerstats.json
          git commit -m "chore: update playerstats.json [skip ci]"

          # Tussen de checkout en nu kan er een andere commit binnengekomen
          # zijn, bijvoorbeeld van de bot die matches.json bijwerkt. Rebasen
          # in plaats van forceren, zodat die commit niet verloren gaat.
          git pull --rebase --autostash
          git push
          echo "playerstats.json gecommit"
