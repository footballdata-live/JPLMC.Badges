# =============================================================================
#  euromatches.yml v5 - bouwt euromatches.json voor de clubfanpages
# =============================================================================
#  Draait IN de repo footballdata-live/JPLMC.Badges zelf. Daardoor is er geen
#  PAT nodig: de ingebouwde GITHUB_TOKEN volstaat om terug te committen.
#  Zelfde patroon als playerstats.yml v2.
#
#  v4 ten opzichte van v3:
#    - Script naar v1.4: eindstand bij verlengingen uit extra_time_score.
#
#  v3 ten opzichte van v2:
#    - python3 -u, zodat de uitvoer regel per regel in de log verschijnt.
#      Zonder die vlag buffert Python alles tot het proces klaar is, en dan
#      staat er bij een hangende run niets in de log. Een run bleef vier
#      minuten staan zonder dat vast te stellen was waar hij zat.
#    - Script naar v1.3, met een voortgangsregel per pagina en een harde
#      bovengrens op de totale duur.
#
#  v2 ten opzichte van v1:
#    - DATA_REPO_TOKEN en de vlag --push zijn weg. De commit gebeurt hier.
#      De eerste run van v1 strandde hier: het bestand werd gebouwd, de push
#      werd overgeslagen omdat de PAT niet bestond, en de run was groen.
#    - De curl-stap is weg. euromatches.json staat in deze repo en komt mee
#      met de checkout. Via GitHub Pages ophalen was fragiel: Pages loopt
#      achter op de repo omdat de site eerst moet bouwen, dus twee runs kort
#      na elkaar lazen een verouderde versie. Dat is hier extra vervelend,
#      want het script voegt samen met wat er al staat.
#
#  BENODIGDE SECRET
#    BSD_KEY - dezelfde als bij bouw_players en playerstats
#
#  EENMALIG CONTROLEREN
#    Settings, Actions, General, Workflow permissions moet op
#    "Read and write permissions" staan. Zonder dat is de run groen terwijl
#    er niets gecommit wordt. Die instelling is bij deze repo al eens stil
#    teruggevallen op read-only.
# =============================================================================

name: euromatches

on:
  # Dagelijks om 06:15 UTC, een kwartier na bekermatches zodat ze elkaar niet
  # in de weg zitten bij het pushen naar dezelfde repo.
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

# Nodig om te kunnen terugcommitten met GITHUB_TOKEN.
permissions:
  contents: write

concurrency:
  group: euromatches
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest

    steps:
      - name: Repo uitchecken
        uses: actions/checkout@v4

      - name: Python opzetten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: euromatches.json bouwen
        env:
          BSD_KEY: ${{ secrets.BSD_KEY }}
        run: |
          # -u is niet optioneel: zonder die vlag verschijnt er geen enkele
          # regel in de log tot het script klaar is.
          python3 -u bouw_euromatches_v1.5.py --toon

      - name: Committen als er iets veranderd is
        run: |
          # git diff beslist, niet de uitvoer van het script. Zo wordt er
          # nooit een lege commit gemaakt, ook niet als het script wel
          # schreef maar de inhoud identiek bleef.
          if git diff --quiet -- euromatches.json; then
            echo "euromatches.json ongewijzigd, niets te committen"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add euromatches.json
          git commit -m "chore: update euromatches.json [skip ci]"

          # Tussen de checkout en nu kan er een andere commit binnengekomen
          # zijn, bijvoorbeeld van de bot die matches.json bijwerkt. Rebasen
          # in plaats van forceren, zodat die commit niet verloren gaat.
          git pull --rebase --autostash
          git push
          echo "euromatches.json gecommit"
