name: players sync

# =============================================================================
#  JPL Fantasy Manager - spelerssynchronisatie  v3.0
# =============================================================================
#  v3.0  Roept bouw_players_v3.3.py aan.
#
#        Wat er sinds v2.0 veranderde aan het script:
#        - v3.0 laagsgewijs koppelen in plaats van speler per speler, zodat
#          een zachte match nooit een BSD-record wegneemt dat een hardere
#          match nodig had
#        - v3.1 voortgang per club, meer pogingen, en een harde stop bij een
#          daling van meer dan 15 procent ten opzichte van de vorige publicatie
#        - v3.2 koppelen op Pro League-ID; BSD's clubtoewijzing wordt
#          genegeerd omdat die achterloopt op de transfers
#        - v3.3 brede zoektocht voor wie niet koppelt, plus een handmatige
#          uitsluitingslijst voor spelers die nog in een Pro League-selectie
#          staan maar aantoonbaar weg zijn
#
#        LOOPTIJD: reken op 4 tot 6 minuten. Het BSD-endpoint /api/players/
#        is traag (soms 40 seconden voor een club) en de brede zoektocht doet
#        er nog enkele calls bij. De timeout staat daarom op 20 minuten.
#
#  Deze workflow hoort in .github/workflows/ van JPLMC.Badges.
#  In dezelfde repo moeten staan:
#     bouw_players_v3.3.py
#     fm_basis_v2.json
#
#  Secrets in JPLMC.Badges -> Settings -> Secrets and variables -> Actions:
#     BSD_KEY           BSD API-token
#     MANAGER_API_KEY   voor het legen van de Worker-cache
#
#  Regelset 10.5: 05:00 en 17:00 Belgische tijd. GitHub draait op UTC, dus in
#  de zomertijd 03:00 en 15:00. Eind oktober moet dit 04:00 en 16:00 worden om
#  dezelfde lokale tijden te houden.
# =============================================================================

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repo uitchecken
        uses: actions/checkout@v4

      - name: Python klaarzetten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bestanden controleren
        run: |
          echo "--- inhoud van de repo ---"
          ls -la
          echo "--------------------------"
          ontbreekt=0
          for f in bouw_players_v3.3.py fm_basis_v2.json; do
            if [ -f "$f" ]; then
              echo "OK        $f  ($(wc -c < "$f") bytes)"
            else
              echo "ONTBREEKT $f"
              ontbreekt=1
            fi
          done
          for f in bouw_players.py bouw_players_v2.py bouw_players_v3.py \
                   bouw_players_v3.1.py bouw_players_v3.2.py fm_basis.json; do
            if [ -f "$f" ]; then
              echo "LET OP    $f staat er nog - oude versie, mag weg"
            fi
          done
          if [ "$ontbreekt" = "1" ]; then
            echo ""
            echo "Een vereist bestand ontbreekt in de repo."
            exit 1
          fi

      - name: players.json bouwen
        id: bouw
        shell: bash
        env:
          BSD_KEY: ${{ secrets.BSD_KEY }}
        run: |
          # pipefail is essentieel: zonder dit maskeert tee een crash van python
          set -o pipefail
          python3 bouw_players_v3.3.py \
            --basis fm_basis_v2.json \
            --uit players.json | tee uitvoer.log
          if grep -q '^WIJZIGING=ja' uitvoer.log; then
            echo "gewijzigd=ja" >> "$GITHUB_OUTPUT"
          else
            echo "gewijzigd=nee" >> "$GITHUB_OUTPUT"
          fi

      - name: Samenvatting
        if: always()
        shell: bash
        run: |
          if [ ! -f uitvoer.log ]; then
            echo "Geen uitvoer.log - het script is niet tot draaien gekomen."
            exit 0
          fi
          {
            echo "## Spelerssynchronisatie"
            echo ""
            grep -E '^  (in de databank|via Pro League-ID|via naam|via zoektocht|geen BSD-record)' \
              uitvoer.log || true
            echo ""
            if grep -q '^FOUT' uitvoer.log; then
              echo "### Afgebroken"
              grep -A3 '^FOUT' uitvoer.log || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Committen en pushen
        if: steps.bouw.outputs.gewijzigd == 'ja'
        run: |
          git config user.name  "matchcenter-bot"
          git config user.email "matchcenter.bot@users.noreply.github.com"
          git add players.json
          if git diff --cached --quiet; then
            echo "Geen verschil ten opzichte van de vorige versie."
            exit 0
          fi
          git commit -m "players.json bijgewerkt [auto]"
          git push

      - name: Worker-cache legen
        if: steps.bouw.outputs.gewijzigd == 'ja'
        continue-on-error: true
        env:
          MANAGER_API_KEY: ${{ secrets.MANAGER_API_KEY }}
        run: |
          curl -sS -X POST \
            -H "X-API-Key: ${MANAGER_API_KEY}" \
            https://manager.matchcenter-bot.workers.dev/admin/cache/clear \
            || echo "Cache legen mislukt - niet kritiek."
